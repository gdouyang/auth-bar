name: Build and Release AuthBar

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package AuthBar
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode* || true
          xcodebuild -version
          swift --version

      - name: Run Unit Tests
        run: swift test

      - name: Build and Package App Bundle
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Archive AuthBar.app
        run: |
          zip -r -y AuthBar-macOS.zip AuthBar.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuthBar-macOS
          path: AuthBar-macOS.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AuthBar-macOS.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Release AuthBar

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package AuthBar
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_16=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_16" ]; then
            echo "Switching to: $XCODE_16"
            sudo xcode-select -s "$XCODE_16/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Run Unit Tests
        run: swift test

      - name: Build and Package App Bundle
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Archive AuthBar.app
        run: |
          zip -r -y AuthBar-macOS.zip AuthBar.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuthBar-macOS
          path: AuthBar-macOS.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AuthBar-macOS.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
